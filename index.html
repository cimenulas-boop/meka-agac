<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MEKA Karar Ağacı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Yerleşim: telefon öncelikli tek sütun; üstte yapışkan çubuk, altında üç karar kapısı, sonra içerik. Masaüstünde içerik 980px ile sınırlı. */
:root {
  --bg: #F6F4EE; --card: #FFFFFF; --ink: #16181B; --sub: #454A50; --grey: #6B7178; --rule: #D5D0C4; --track: #ECE8DE;
  --acc: #B8430E; --acc-soft: #F8E3D8; --steel: #1F4E6B; --steel-soft: #DDE8EF; --gold: #8A6A00; --ok: #2E6B3A; --ok-soft: #DDEBDF;
  --disp: 'Barlow Condensed', 'Arial Narrow', sans-serif; --body: 'IBM Plex Sans', 'Segoe UI', sans-serif;
  --fs: 17px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: var(--fs); line-height: 1.45; }
a { color: var(--steel); }
h1, h2, h3 { font-family: var(--disp); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; font-weight: 700; }
h2 { font-size: 26px; font-weight: 700; }
h3 { font-size: 21px; font-weight: 700; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 48px; display: flex; flex-direction: column; gap: 16px; }
#bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: #fff; }
#bar .in { max-width: 980px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
#bar .brand { font-family: var(--disp); font-weight: 700; font-size: 22px; letter-spacing: 0.03em; color: #fff; text-decoration: none; }
#bar .brand small { font-family: var(--body); font-weight: 400; font-size: 13px; opacity: 0.8; margin-left: 8px; }
#bar nav { display: flex; gap: 4px; flex-wrap: wrap; }
#bar nav a { color: #fff; text-decoration: none; font-size: 15px; padding: 6px 10px; border-radius: 6px; }
#bar nav a.on, #bar nav a:hover { background: rgba(255,255,255,0.14); }
.eyebrow { font-family: var(--disp); font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--acc); }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.soft { background: var(--track); }
.muted { color: var(--sub); font-size: 15px; }
.tiny { color: var(--grey); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--track); color: var(--sub); white-space: nowrap; }
.pill.acc { background: var(--acc-soft); color: var(--acc); }
.pill.steel { background: var(--steel-soft); color: var(--steel); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: #F3E9C8; color: var(--gold); }
.sym { font-weight: 700; width: 1.1em; display: inline-block; text-align: center; }
.sym.one_cikan { color: var(--acc); } .sym.ikincil { color: #2E3A45; } .sym.izle { color: var(--grey); } .sym.elendi { color: var(--grey); }
/* kapılar */
#gates { display: grid; grid-template-columns: 1fr; gap: 10px; }
.gate { display: flex; flex-direction: column; gap: 6px; }
.gate .q { font-weight: 600; font-size: 15px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--rule); background: var(--card); color: var(--ink); padding: 8px 12px; border-radius: 8px; font-size: 15px; }
.seg button.on { background: var(--acc); border-color: var(--acc); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
@media (min-width: 760px) { #gates { grid-template-columns: 1fr 1fr 1fr; } }
/* ağaç */
.tree { display: flex; flex-direction: column; gap: 14px; }
.root { background: var(--ink); color: #fff; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.root h2 { color: #fff; }
.branch { border-left: 5px solid var(--acc); border-radius: 10px; background: var(--card); border-top: 1px solid var(--rule); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.branch.bagimsiz { border-left-color: var(--steel); }
.branch > a.head { text-decoration: none; color: inherit; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.branch > a.head h2 { color: var(--acc); }
.branch.bagimsiz > a.head h2 { color: var(--steel); }
.kols { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 760px) { .kols { grid-template-columns: 1fr 1fr 1fr; } }
.kol { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); min-width: 0; }
.kol > a.head { text-decoration: none; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.kol > a.head h3 { font-size: 19px; }
.leaf { display: grid; grid-template-columns: 1.2em minmax(0, 1fr) auto; gap: 6px; align-items: baseline; text-decoration: none; color: var(--ink); padding: 5px 0; border-top: 1px solid var(--rule); font-size: 15.5px; }
.leaf:first-of-type { border-top: 0; }
.leaf .t { min-width: 0; }
.leaf .s { color: var(--grey); font-size: 13px; white-space: nowrap; }
.leaf.off { opacity: 0.45; }
.leaf.off .t::after { content: " · seçime uymaz"; color: var(--grey); font-size: 13px; }
/* listeler */
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start; }
.step .n { font-family: var(--disp); font-weight: 700; font-size: 20px; color: var(--acc); line-height: 1.1; }
.step .meta { color: var(--grey); font-size: 13.5px; }
.rank { display: flex; flex-direction: column; }
.rank a { display: grid; grid-template-columns: 28px 1.2em minmax(0, 1fr); gap: 6px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.rank a:first-child { border-top: 0; }
.rank .n { font-family: var(--disp); font-weight: 700; font-size: 20px; color: var(--acc); }
.rank .why { color: var(--sub); font-size: 14.5px; }
.rank a.off { opacity: 0.5; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.kv .r { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-top: 1px solid var(--rule); }
.kv .r:first-child { border-top: 0; }
.kv .k { font-family: var(--disp); font-weight: 700; font-size: 20px; color: var(--steel); line-height: 1.1; }
.kv .src { color: var(--grey); font-size: 13px; }
ul.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.tl { display: flex; flex-direction: column; }
.tl .e { display: grid; grid-template-columns: 96px 14px minmax(0, 1fr); gap: 8px; align-items: start; padding: 7px 0; border-top: 1px solid var(--rule); }
.tl .e:first-child { border-top: 0; }
.tl .d { font-weight: 600; font-size: 14.5px; text-align: right; white-space: nowrap; }
.tl .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; }
.tl .gecti .d, .tl .gecti .t { color: var(--grey); } .tl .gecti .dot { background: var(--grey); }
.tl .yakin .d { color: var(--acc); } .tl .yakin .dot { background: var(--acc); }
.tl .ileri .d { color: var(--steel); } .tl .ileri .dot { background: var(--steel); }
.tl .bugun .d { color: var(--ink); } .tl .bugun .dot { background: var(--ink); width: 12px; height: 12px; }
.tl .t small { color: var(--grey); display: block; font-size: 13px; }
.back { font-size: 15px; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.match { display: grid; grid-template-columns: 1fr; gap: 6px; }
.match .m { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 15px; }
.match .m:first-child { border-top: 0; }
details summary { cursor: pointer; font-weight: 600; }
.prog { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ok); }
.edit { display: none; flex-direction: column; gap: 8px; border-top: 1px dashed var(--rule); padding-top: 10px; }
body.editing .edit { display: flex; }
.edit input[type=text], .edit select, .edit input[type=number] { font: inherit; font-size: 15px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; width: 100%; }
.edit label { font-size: 14px; color: var(--sub); display: flex; flex-direction: column; gap: 3px; }
.btn { border: 1px solid var(--rule); background: var(--card); padding: 7px 12px; border-radius: 8px; font-size: 15px; }
.btn.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
.task { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 15px; }
.task.done { color: var(--grey); text-decoration: line-through; }
.foot { color: var(--grey); font-size: 13px; border-top: 1px solid var(--rule); padding-top: 10px; }
.search { width: 100%; font: inherit; font-size: 16px; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 8px; }
@media (prefers-reduced-motion: no-preference) { .seg button, .leaf, .rank a { transition: background 0.15s ease, opacity 0.15s ease; } }
</style>
</head>
<body>
<div id="bar"><div class="in">
  <a class="brand" href="#/">MEKA · Karar ağacı<small id="brandDate"></small></a>
  <nav>
    <a href="#/" data-nav="/">Ağaç</a>
    <a href="#/takvim" data-nav="/takvim">Takvim</a>
    <a href="#/calismalar" data-nav="/calismalar">Çalışmalar</a>
    <a href="#/ne-yapmali" data-nav="/ne-yapmali">Ne yapmalıyız</a>
  </nav>
</div></div>
<main class="wrap" id="app"></main>
<script src="data.js"></script>
<script>
(function () {
  var D = window.MEKA_DATA;
  if (!D) { document.getElementById('app').innerHTML = '<div class="card">data.js yüklenemedi.</div>'; return; }
  document.getElementById('brandDate').textContent = D.derleme_tarihi;
  var BANT_SYM = { one_cikan: '★', ikincil: '○', izle: '▽', elendi: '▽' };
  var BANT_AD = { one_cikan: 'öne çıkan', ikincil: 'ikincil', izle: 'izle', elendi: 'elendi' };
  var BANT_SIRA = { one_cikan: 0, ikincil: 1, izle: 2, elendi: 3 };
  var BUTCE_AD = { 1: '100 bin $ altı', 2: '100 bin ile 1 M$', 3: '1 ile 10 M$', 4: '10 M$ üstü' };
  var YAT_AD = { sirket: 'şirket', kisisel: 'kişisel', ikisi: 'ikisi de olur' };
  var YOL_AD = { kur: 'kuralım', ortak: 'ortak olalım', ikisi: 'ikisi de olur' };

  // ---- durum (yalnızca yöneticinin işaretlediği ilerleme) ----
  var durum = {};
  try { durum = JSON.parse(localStorage.getItem('meka_durum') || '{}'); } catch (e) { durum = {}; }
  if (D.durum) { Object.keys(D.durum).forEach(function (k) { if (!durum[k]) durum[k] = D.durum[k]; }); }
  function saveDurum() { try { localStorage.setItem('meka_durum', JSON.stringify(durum)); } catch (e) {} }

  // ---- kapılar ----
  var sel = { yatirim: 'hepsi', butce: 'hepsi', yol: 'hepsi' };
  try { var s0 = JSON.parse(localStorage.getItem('meka_sel') || 'null'); if (s0) sel = s0; } catch (e) {}
  function saveSel() { try { localStorage.setItem('meka_sel', JSON.stringify(sel)); } catch (e) {} }
  function uyum(t) {
    var k = t.kapilar || {}; var r = { yatirim: true, butce: true, yol: true };
    if (sel.yatirim !== 'hepsi') r.yatirim = (k.yatirim === sel.yatirim || k.yatirim === 'ikisi');
    if (sel.butce !== 'hepsi') r.butce = ((k.butce || 1) <= Number(sel.butce));
    if (sel.yol !== 'hepsi') r.yol = (k.yol === sel.yol || k.yol === 'ikisi');
    r.ok = r.yatirim && r.butce && r.yol; return r;
  }
  function secimMetni() {
    var p = [];
    p.push(sel.yatirim === 'hepsi' ? 'yatırım: karar yok' : 'yatırım: ' + (sel.yatirim === 'sirket' ? 'şirket' : 'kişisel'));
    p.push(sel.butce === 'hepsi' ? 'bütçe: karar yok' : 'bütçe: ' + BUTCE_AD[sel.butce]);
    p.push(sel.yol === 'hepsi' ? 'yol: karar yok' : 'yol: ' + (sel.yol === 'kur' ? 'kuralım' : 'ortak olalım'));
    return p.join(' · ');
  }

  // ---- yardımcılar ----
  function e(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function topic(id) { return D.konular[id]; }
  function region(id) { return D.bolgeler[id]; }
  function regionTopics(rid) {
    var r = region(rid); var ids = (r && r.konu_ids) || []; return ids.map(topic).filter(Boolean);
  }
  // Saha kararı: yönetici görüşme sonrası bandı ve saha puanını elle değiştirebilir; sıralama bunu kullanır
  function saha(id) { return durum[id] || {}; }
  function bantOf(t) { var s = saha(t.id); return s.saha_bant ? s.saha_bant : t.bant; }
  function sirala(list, rid) {
    var r = rid ? region(rid) : null; var order = {};
    if (r && r.siralama) r.siralama.forEach(function (x, i) { order[x.id] = i; });
    return list.slice().sort(function (a, b) {
      var ua = uyum(a).ok ? 0 : 1, ub = uyum(b).ok ? 0 : 1; if (ua !== ub) return ua - ub;
      var ba = BANT_SIRA[bantOf(a)], bb = BANT_SIRA[bantOf(b)]; if (ba !== bb) return ba - bb;
      var pa = Number(saha(a.id).saha_puan || 0), pb = Number(saha(b.id).saha_puan || 0); if (pa !== pb) return pb - pa;
      var oa = order[a.id] == null ? 99 : order[a.id], ob = order[b.id] == null ? 99 : order[b.id]; if (oa !== ob) return oa - ob;
      return (b.kanit || 0) - (a.kanit || 0);
    });
  }
  function leafHtml(t) {
    var u = uyum(t); var b = bantOf(t); var s = saha(t.id);
    return '<a class="leaf' + (u.ok ? '' : ' off') + '" href="#/konu/' + t.id + '"><span class="sym ' + b + '">' + BANT_SYM[b] + '</span><span class="t">' + e(t.kisa || t.baslik) + (s.saha_bant || s.saha_puan ? ' <span class="tiny">· saha' + (s.saha_puan ? ' ' + e(s.saha_puan) + '/5' : '') + '</span>' : '') + '</span><span class="s">' + e(t.puan_kisa || '') + '</span></a>';
  }
  function pdfLink(tc) {
    var f = D.dosyalar[tc.dosya]; if (!f) return '';
    var href = 'pdf/' + f.pdf + (tc.sayfa ? '#page=' + tc.sayfa : '');
    return '<a href="' + href + '" target="_blank" rel="noopener">' + e(f.ad) + (tc.sayfa ? ', s. ' + tc.sayfa : '') + '</a>' + (tc.bolum_basligi ? ' <span class="tiny">' + e(tc.bolum_basligi) + '</span>' : '');
  }
  function ilerleme(id) {
    var d = durum[id] || {}; var g = d.gorevler || []; var bitti = g.filter(function (x) { return x.bitti; }).length;
    var yuzde = d.ilerleme != null ? Number(d.ilerleme) : (g.length ? Math.round(100 * bitti / g.length) : 0);
    return { yuzde: yuzde, toplam: g.length, bitti: bitti, durum: d.durum || 'başlanmadı', gorevler: g, not: d.not || '', saha_bant: d.saha_bant || '', saha_puan: d.saha_puan || '', saha_not: d.saha_not || '', saha_tarih: d.saha_tarih || '' };
  }

  // ---- kapı paneli ----
  function gatesHtml() {
    function seg(name, opts) {
      return '<div class="seg">' + opts.map(function (o) { return '<button type="button" data-gate="' + name + '" data-val="' + o[0] + '" class="' + (String(sel[name]) === String(o[0]) ? 'on' : '') + '">' + e(o[1]) + '</button>'; }).join('') + '</div>';
    }
    return '<div class="card"><div class="eyebrow">Yönetimin üç kararı</div><p class="muted">Seçim yapınca uymayan yapraklar soluklaşır, sıralama ve yapılacaklar değişir. Seçim bu cihazda kalır.</p><div id="gates">' +
      '<div class="gate"><div class="q">1. Yatırım kimin üzerinden?</div>' + seg('yatirim', [['sirket', 'Şirket (MEKA)'], ['kisisel', 'Kişisel'], ['hepsi', 'Karar yok']]) + '</div>' +
      '<div class="gate"><div class="q">2. İlk bütçe dilimi?</div>' + seg('butce', [['1', '< 100 bin $'], ['2', '100 bin ile 1 M$'], ['3', '1 ile 10 M$'], ['4', '> 10 M$'], ['hepsi', 'Karar yok']]) + '</div>' +
      '<div class="gate"><div class="q">3. Kuralım mı, ortak mı olalım?</div>' + seg('yol', [['kur', 'Kuralım'], ['ortak', 'Ortak olalım'], ['hepsi', 'Karar yok']]) + '</div>' +
      '</div><details><summary class="tiny">Dilim ve kapı kuralı</summary><p class="tiny" style="margin-top:4px">' + e(D.dilim_kurali || '') + '</p></details></div>';
  }

  // ---- sayfalar ----
  function homeHtml() {
    var h = '';
    h += '<div><div class="eyebrow">MEKA Global · yeni iş alanı araştırmaları</div><h1>' + e(D.baslik) + '</h1><p class="muted">' + e(D.alt_baslik) + '</p></div>';
    h += gatesHtml();
    h += '<div class="card soft edit"><div class="eyebrow">Düzenleme modu nasıl işler</div><ul class="plain"><li>Bir yaprağı aç, en alttaki Durum kartında ilerleme, görevler ve saha kararını (bant, saha puanı, görüşme notu) gir, Kaydet.</li><li>Saha bandı çalışmanın bandının önüne geçer; saha puanı aynı banttaki yaprakları sıralar. Bölge sıralamaları ve "Ne yapmalıyız" anında değişir.</li><li>Herkes görsün istersen sayfanın altındaki "Durumu dışa aktar" ile durum.json indir, siteye (GitHub deposunun köküne) yükle. İşaretler o zaman bütün cihazlarda görünür.</li><li>Görüşme notlarını bana da gönderirsen özeti ve tam çalışmayı yeniden yazarım; o zaman veri dosyası güncellenir.</li></ul></div>';
    h += '<div class="tree">';
    h += '<div class="root"><div class="eyebrow" style="color:#F2B28B">Kök</div><h2>MEKA</h2><p class="muted" style="color:#ddd">' + e(D.kok_notu) + '</p></div>';
    D.agac.forEach(function (br) {
      h += '<div class="branch ' + br.id + '"><a class="head" href="#/bolge/' + br.id + '"><h2>' + e(br.ad) + '</h2><span class="tiny">' + e(br.aciklama) + ' · bölge özeti ›</span></a><div class="kols">';
      br.kollar.forEach(function (k) {
        var ts = sirala(k.konular.map(topic).filter(Boolean), k.id);
        h += '<div class="kol"><a class="head" href="#/bolge/' + k.id + '"><h3>' + e(k.ad) + '</h3><span class="tiny">' + ts.length + ' yaprak ›</span></a><div>' + ts.map(leafHtml).join('') + '</div></div>';
      });
      h += '</div></div>';
    });
    h += '</div>';
    h += '<div class="card"><div class="eyebrow">İşaretler</div><p class="muted"><b class="sym one_cikan">★</b> öne çıkan · <b class="sym ikincil">○</b> ikincil · <b class="sym izle">▽</b> izle veya elendi. Puanlar her çalışmanın kendi ölçeğidir: savunma 5 üzerinden, 5+5 çalışması 10 üzerinden, diğerleri sıra numarası. Birleştirilmedi.</p></div>';
    h += '<div class="card"><div class="eyebrow">Görüş</div>' + D.gorus.map(function (g) { return '<p style="padding-left:10px;border-left:3px solid var(--acc)">' + e(g) + '</p>'; }).join('') + '</div>';
    h += '<div class="foot">' + e(D.dipnot) + '</div>';
    return h;
  }

  function regionHtml(rid) {
    var r = region(rid); if (!r) return '<div class="card">Bölge bulunamadı.</div>';
    var ts = sirala(regionTopics(rid), rid);
    var why = {}; (r.siralama || []).forEach(function (x) { why[x.id] = x.neden; });
    var h = '<a class="back" href="#/">‹ Ağaca dön</a>';
    h += '<div><div class="eyebrow">Bölge</div><h1>' + e(r.baslik) + '</h1><p class="muted">' + ts.length + ' yaprak · ' + e(secimMetni()) + '</p></div>';

  function tlHtml(list) {
    var today = D.bugun_iso;

    return '<div class="tl">' + sorted.map(function (x) {
      var cls = 'ileri';
      if (x.iso) { if (x.iso < today) cls = 'gecti'; else if (x.iso === today) cls = 'bugun'; else if (daysBetween(today, x.iso) <= 30) cls = 'yakin'; }
      return '<div class="e ' + cls + '"><div class="d">' + e(x.tarih) + '</div><div class="dot"></div><div class="t">' + e(x.olay) + (x.konu_id && topic(x.konu_id) ? ' <a href="#/konu/' + x.konu_id + '">' + e(topic(x.konu_id).kisa || topic(x.konu_id).baslik) + '</a>' : '') + (x.kaynak ? '<small>' + e(x.kaynak) + '</small>' : '') + '</div></div>';
    }).join('') + '</div>';
  }
  function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

    else if (hash.indexOf('/calismalar') === 0) html = calismalarHtml();

      var id = b.dataset.id; var box = b.closest('.card'); var d = durum[id] || {};
      d.durum = box.querySelector('[data-ed=durum]').value; d.ilerleme = Number(box.querySelector('[data-ed=ilerleme]').value);
      d.gorevler = box.querySelector('[data-ed=gorevler]').value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean).map(function (l) { var done = /^x\s+/i.test(l); return { ad: l.replace(/^x\s+/i, ''), bitti: done }; });
      d.not = box.querySelector('[data-ed=not]').value;
      d.saha_bant = box.querySelector('[data-ed=saha_bant]').value; d.saha_puan = box.querySelector('[data-ed=saha_puan]').value;
      d.saha_not = box.querySelector('[data-ed=saha_not]').value; d.saha_tarih = box.querySelector('[data-ed=saha_tarih]').value;
      durum[id] = d; saveDurum(); render(); return;
    }
  });
  window.addEventListener('hashchange', render);
  render();
  // Sitenin kökünde durum.json varsa (yöneticinin dışa aktardığı işaretler) herkes için yükle; yerel işaretler önde kalır.
  try {
    fetch('durum.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j) return; var changed = false;
      Object.keys(j).forEach(function (k) { if (!durum[k]) { durum[k] = j[k]; changed = true; } });
      if (changed) render();
    }).catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
